name: Build and deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t sironmudalige/flask-visitor-counter:latest .

      - name: Push to Docker Hub
        run: |
          docker push sironmudalige/flask-visitor-counter:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull sironmudalige/flask-visitor-counter:latest
            docker stop flaskapp || true
            docker rm flaskapp || true
            docker run -d \
              -p 5000:5000 \
              --restart always \
              --name flaskapp \
              sironmudalige/flask-visitor-counter:latest
